<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Web Developer Portfolio - Modern websites and digital experiences."
    >

    <title>Web Developer | Portfolio</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <!-- =========================
             HERO / HOME
        ========================== -->
        <section class="hero" id="home">

            <header class="navbar">

                <a href="#home" class="logo">
                  HEYY, I'M ASH<span>.</span>
                </a>

                <nav class="desktop-nav" aria-label="Main navigation">
                    <a href="#work">WORK</a>
                    <a href="#about">ABOUT</a>
                    <a href="#contact">START A PROJECT</a>
                </nav>

                <button
                    class="menu-button"
                    id="menuButton"
                    aria-label="Open navigation menu"
                    aria-expanded="false"
                >
                    <span></span>
                    <span></span>
                </button>

            </header>


            <!-- Giant background typography -->
           <!-- WEB stays behind character -->
<div class="hero-title" aria-hidden="true">
    <div class="web-word">WEB</div>
</div>

<!-- CHARACTER -->
<div class="character-wrapper">
    <picture>
        <source
            media="(max-width: 700px)"
            srcset="images/phone-view.png"
        >

        <img
            src="images/laptop-view.png"
            alt="3D developer character"
            class="character"
        >
    </picture>
</div>

<!-- DEVELOPER stays IN FRONT of character -->
<div class="developer-word" aria-hidden="true">
    DEVELOPER
</div>


            
            <!-- Right description -->
            <div class="hero-description">
                <p>
                    I BUILD FAST, MODERN
                    WEBSITES THAT HELP
                    BRANDS STAND OUT.
                </p>

                <a href="#contact" class="project-link">
                    START A PROJECT
                    <span>↗</span>
                </a>
            </div>


            <!-- Bottom -->
            <div class="hero-bottom">

                <a href="#work" class="work-link">
                    <span class="arrow">↓</span>
                    VIEW MY WORK
                </a>

                
            </div>

        </section>


        <!-- Temporary anchors.
             Actual sections hum baad mein banayenge. -->

        <div id="work"></div>
        <div id="about"></div>
        <div id="contact"></div>

    </main>


   <div class="mobile-menu" id="mobileMenu">

    <button
        class="menu-close"
        id="menuClose"
        aria-label="Close navigation menu"
    >
        <span></span>
        <span></span>
    </button>

    <nav>
        <a href="#home">HOME</a>
        <a href="#work">WORK</a>
        <a href="#about">ABOUT</a>
        <a href="#contact">START PROJECT</a>
    </nav>

</div>

    <script src="script.js"></script>

</body>
</html>
